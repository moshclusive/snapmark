<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapmark</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Sleek Compact Header matching Snapmark Logo Colors -->
    <header class="header">
      <div class="brand">
        <img src="assets/Icon/icon32.png" alt="Snapmark" class="brand-icon" />
        <span class="brand-title">Snapmark</span>
      </div>
      <div class="badge">PRO</div>
    </header>

    <!-- Hairline Progress Indicator for full-page captures -->
    <div id="progress-bar-wrap" class="progress-wrap hidden">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <!-- Compact Action Menu (Zero Shortkeys, Zero Clutter) -->
    <nav class="menu-list">
      <!-- 1. Full Page + PDF -->
      <button class="menu-item primary" data-action="capture-full-pdf" title="Capture full page & Save as PDF directly">
        <span class="menu-icon icon-lightning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </span>
        <span class="menu-label">Capture Entire Page + PDF</span>
      </button>

      <div class="menu-sep"></div>

      <!-- 2. Capture Entire Page -->
      <button class="menu-item" data-action="capture-entire-page" title="Scroll & stitch entire page into editor">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </span>
        <span class="menu-label">Capture Entire Page</span>
      </button>

      <!-- 3. Capture Visible Part -->
      <button class="menu-item" data-action="capture-visible" title="Capture current visible viewport">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </span>
        <span class="menu-label">Capture Visible Part</span>
      </button>

      <!-- 4. Capture Selection -->
      <button class="menu-item" data-action="capture-selection" title="Select custom area on screen (Ctrl for 1:1)">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
            <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
            <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
          </svg>
        </span>
        <span class="menu-label">Capture Selection</span>
      </button>

      <!-- 5. Capture Browser Window -->
      <button class="menu-item" data-action="capture-browser-window" title="Capture with clean browser mockup frame">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <circle cx="6.5" cy="6.5" r="0.8" fill="currentColor"></circle>
            <circle cx="9.5" cy="6.5" r="0.8" fill="currentColor"></circle>
          </svg>
        </span>
        <span class="menu-label">Capture Browser Window</span>
      </button>

      <!-- 6. Extract Text from Image -->
      <button class="menu-item" data-action="extract-text" title="Select area to extract and copy text (OCR)">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
        </span>
        <span class="menu-label">Extract Text from Image</span>
      </button>
    </nav>

    <!-- Status message -->
    <div id="status-box" class="status-box hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
